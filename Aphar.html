Q.forEach(x=>{if(x.s=="配醣體總論"||x.s=="強心配醣體")x.s="配醣體"});
const $=document.getElementById('app'),L='ABCD';
let W=[];try{W=JSON.parse(localStorage.getItem('aphar_wrong')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('aphar_wrong',JSON.stringify(W))}catch(e){}};
const secs=[...new Set(Q.map(x=>x.s))];
let S;
const N=15;
let SEEN=[];try{SEEN=JSON.parse(localStorage.getItem('aphar_seen')||'[]')}catch(e){}
const saveSeen=()=>{try{localStorage.setItem('aphar_seen',JSON.stringify(SEEN))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const unseenOf=ids=>ids.filter(i=>!SEEN.includes(i));
function draw(pool,t){
  if(t=='錯題')return shuf(pool).slice(0,N);
  const u=shuf(unseenOf(pool)),s=shuf(pool.filter(i=>SEEN.includes(i)));
  return u.concat(s).slice(0,N);
}
function home(){
  W=W.filter(i=>Q[i]);SEEN=SEEN.filter(i=>Q[i]);
  const all=Q.map((_,i)=>i),un=unseenOf(all).length;
  $.innerHTML=`<h1>A'phar 生藥學練習題</h1><p class="sub">共 ${Q.length} 題 · 每次抽 ${N} 題,優先抽沒做過的 · 作答後顯示每個選項的詳解</p>
  <div class="bar" title="已做過"><i style="width:${(Q.length-un)/Q.length*100}%"></i></div>
  <p class="sub">已做過 ${Q.length-un} / ${Q.length} 題 · 還沒做過 ${un} 題</p>
  <h2>混合練習</h2>
  <button class="row pri" onclick="start(Q.map((_,i)=>i),'混合')"><span>所有章節混合(抽 ${N} 題)</span><small>未做 ${un}</small></button>
  <h2>錯題測驗區</h2>
  <button class="row" ${W.length?'':'disabled style="opacity:.5"'} onclick="start(W.slice(),'錯題')"><span>重做錯題(最多 ${N} 題)</span><small>${W.length} 題</small></button>
  ${W.length?'<button class="row" onclick="W=[];save();home()"><span>清空錯題本</span></button>':''}
  <h2>依章節練習</h2>`+secs.map(s=>{const ids=Q.map((x,i)=>x.s==s?i:-1).filter(i=>i>=0);return `<button class="row" onclick='start(${JSON.stringify(ids)},"${s}")'><span>${s}</span><small>未做 ${unseenOf(ids).length} / ${ids.length}</small></button>`}).join('')
  +`<h2>做題紀錄</h2><button class="row" onclick="if(confirm('確定要清除「已做過」紀錄?錯題本不會被清除。')){SEEN=[];saveSeen();home()}"><span>重設已做過紀錄</span></button>`;
}
function start(pool,t){
  S={pool:pool.slice(),ids:draw(pool,t),t,i:0,ok:0,done:0,p:null};show();
}
function show(){
  if(S.i>=S.ids.length)return end();
  const id=S.ids[S.i],x=Q[id],p=S.p;
  $.innerHTML=`<div class="top"><span>${S.t} · ${S.i+1}/${S.ids.length}</span><button onclick="home()" style="background:none;border:0;color:var(--ac)">離開</button></div>
  <div class="bar"><i style="width:${S.i/S.ids.length*100}%"></i></div>
  <div class="tag">${x.s}</div><div class="q">${x.q}</div>`+x.o.map((o,k)=>{
    let c='';if(p!==null){if(k==x.a)c='ok';else if(k==p)c='no'}
    return `<button class="opt ${c}" ${p!==null?'disabled':''} onclick="pick(${k})">${L[k]}. ${o}${p!==null?`<span class="note">${k==x.a?'✓ 正確':'✗ 錯誤'}:${x.n[k]}</span>`:''}</button>`}).join('')
  +(p!==null?`<div class="nav"><button class="pri" onclick="S.i++;S.p=null;show()">${S.i+1<S.ids.length?'下一題':'看結果'}</button></div>`:'');
  window.scrollTo(0,0);
}
function pick(k){
  const id=S.ids[S.i],x=Q[id];S.p=k;S.done++;
  if(!SEEN.includes(id)){SEEN.push(id);saveSeen()}
  if(k==x.a){S.ok++;if(S.t=='錯題')W=W.filter(i=>i!=id)}else if(!W.includes(id))W.push(id);
  save();show();
}
function again(){const p=S.t=='錯題'?W.slice():S.pool;start(p,S.t)}
function end(){
  const left=S.t=='錯題'?W.length:unseenOf(S.pool).length;
  $.innerHTML=`<div class="big">${S.ok}/${S.ids.length}</div><p class="ctr">答對率 ${Math.round(S.ok/S.ids.length*100)}% · 錯題本共 ${W.length} 題<br>${S.t=='錯題'?'錯題本還剩':'這個範圍還沒做過'} ${left} 題</p>
  <div class="nav"><button onclick="home()">回首頁</button>${(S.t=='錯題'&&!W.length)?'':`<button class="pri" onclick="again()">再抽 ${N} 題</button>`}</div>
  ${(S.t!='錯題'&&W.length)?`<div class="nav"><button onclick="start(W.slice(),'錯題')">重做錯題</button></div>`:''}`;
}
home();
</script></body></html>
